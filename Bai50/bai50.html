<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Expense Report</title>
    <style>
        body {
            background-color: white;
            font-family: "Times New Roman", serif;
            font-size: 18px;
        }

        /* Giới hạn chiều rộng để form không giãn hết màn hình */
        .report {
            width: 900px;
            max-width: 92%;
            margin: 20px auto;
            padding: 16px;
            background-color: #ccffff;
            border: 2px solid blue;
        }

        .logo {
            text-align: center;
        }

        .logo img {
            width: 500px;
            max-width: 100%;
            height: auto;
        }

        h2 {
            font-size: 28px;
        }

        input, select, textarea {
            font-size: 16px;
        }

        input[type="text"], select {
            padding: 3px;
        }

        input[type="submit"], input[type="reset"] {
            padding: 5px 10px;
        }

        .name {
            width: 150px;
        }

        .ssn {
            width: 100px;
        }

        textarea {
            width: 560px;
            max-width: 95%;
            height: 80px;
        }

        table {
            width: 100%;
        }

        td {
            text-align: center;
        }

        .date {
            width: 90%;
        }

        .description {
            width: 90%;
        }

        .category {
            width: 95%;
        }

        .amount {
            width: 80%;
        }
    </style>
</head>
<body>
    <div class="report">
    <!-- Hình logo có sẵn trong cùng thư mục -->
    <div class="logo">
        <img src="DeLong.jpg" alt="DeLong Enterprises">
    </div>

    <h2>Travel Expense Report</h2>
    <hr>

    <form>
        <p>
            <label for="first-name">1) First Name:</label>
            <input type="text" id="first-name" name="firstName" class="name">
            <label for="last-name">Last Name:</label>
            <input type="text" id="last-name" name="lastName" class="name">
        </p>

        <p>
            <label for="ssn">2) Social Security Number:</label>
            <input type="text" id="ssn" name="ssn" class="ssn">
        </p>

        <p>
            <label for="department">3) Department:</label>
            <select id="department" name="department">
                <option>Accounting</option>
                <option>Sales</option>
                <option>Marketing</option>
            </select>
        </p>

        <p><label for="purpose">4) Describe the purpose of your trip.</label></p>
        <textarea id="purpose" name="purpose"></textarea>

        <p>5) Itemize your travel expenses</p>

        <!-- Bảng có 4 dòng nhập chi phí -->
        <table border="1" cellpadding="1" cellspacing="2">
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
            <tr>
                <td><input type="text" name="date1" placeholder="mm/dd/yy" class="date" aria-label="Date 1"></td>
                <td><input type="text" name="description1" class="description" aria-label="Description 1"></td>
                <td>
                    <select name="category1" class="category" aria-label="Category 1">
                        <option>Meal</option>
                        <option>Travel</option>
                        <option>Hotel</option>
                        <option>Other</option>
                    </select>
                </td>
                <td><input type="text" name="amount1" class="amount" aria-label="Amount 1"></td>
            </tr>
            <tr>
                <td><input type="text" name="date2" placeholder="mm/dd/yy" class="date" aria-label="Date 2"></td>
                <td><input type="text" name="description2" class="description" aria-label="Description 2"></td>
                <td>
                    <select name="category2" class="category" aria-label="Category 2">
                        <option>Meal</option>
                        <option>Travel</option>
                        <option>Hotel</option>
                        <option>Other</option>
                    </select>
                </td>
                <td><input type="text" name="amount2" class="amount" aria-label="Amount 2"></td>
            </tr>
            <tr>
                <td><input type="text" name="date3" placeholder="mm/dd/yy" class="date" aria-label="Date 3"></td>
                <td><input type="text" name="description3" class="description" aria-label="Description 3"></td>
                <td>
                    <select name="category3" class="category" aria-label="Category 3">
                        <option>Meal</option>
                        <option>Travel</option>
                        <option>Hotel</option>
                        <option>Other</option>
                    </select>
                </td>
                <td><input type="text" name="amount3" class="amount" aria-label="Amount 3"></td>
            </tr>
            <tr>
                <td><input type="text" name="date4" placeholder="mm/dd/yy" class="date" aria-label="Date 4"></td>
                <td><input type="text" name="description4" class="description" aria-label="Description 4"></td>
                <td>
                    <select name="category4" class="category" aria-label="Category 4">
                        <option>Meal</option>
                        <option>Travel</option>
                        <option>Hotel</option>
                        <option>Other</option>
                    </select>
                </td>
                <td><input type="text" name="amount4" class="amount" aria-label="Amount 4"></td>
            </tr>
        </table>

        <p>
            6) Have you submitted your receipts?
            <label><input type="radio" name="receipts" value="yes">Yes</label>
            <label><input type="radio" name="receipts" value="no">No</label>
        </p>

        <input type="submit" value="Submit travel expenses">
        <input type="reset" value="Reset">
    </form>

    <p>Questions? Contact Debbie Larson in Accounting (ext. 2150).</p>
    </div>
</body>
</html>
